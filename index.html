<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>የንብረትና ሂሳብ ቁጥጥር ክፍል</title>
<meta name="theme-color" content="#16241f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@500;700&family=Noto+Sans+Ethiopic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16241f;
    --ink-2: #1f322b;
    --panel: #1c2b25;
    --parchment: #f2ecd9;
    --parchment-dim: #cfc6ac;
    --brass: #c79a45;
    --brass-dim: #8a6d34;
    --good: #6fa287;
    --warn: #d3a24a;
    --danger: #b5563c;
    --border: #35473e;
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--ink);
    color: var(--parchment);
    font-family: 'Noto Sans Ethiopic', sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  h1, h2, h3 { font-family: 'Noto Serif Ethiopic', serif; font-weight: 700; margin: 0 0 12px; color: var(--brass); letter-spacing: 0.2px; }
  h1 { font-size: 18px; }
  h2 { font-size: 17px; }
  h3 { font-size: 15px; color: var(--parchment); }

  header.topbar {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--ink-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header.topbar .brand { display: flex; align-items: center; gap: 10px; }
  header.topbar .brand-mark {
    width: 28px; height: 28px; border: 1.5px solid var(--brass); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--brass);
  }
  header.topbar h1 { margin: 0; font-size: 15px; line-height: 1.3; }

  #app { flex: 1; padding: 14px; padding-bottom: 84px; max-width: 900px; width: 100%; margin: 0 auto; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .panel.nested { background: transparent; border: none; padding: 8px 0 0; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }

  .today-banner { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--parchment-dim); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
  .today-banner strong { color: var(--brass); }

  .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat-card { flex: 1 1 140px; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; background: var(--ink-2); }
  .stat-card .stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600; }
  .stat-card .stat-label { font-size: 11.5px; color: var(--parchment-dim); margin-top: 2px; }
  .stat-card.good .stat-value { color: var(--good); }
  .stat-card.warn .stat-value { color: var(--warn); }
  .stat-card.danger .stat-value { color: var(--danger); }
  .stat-card.neutral .stat-value { color: var(--parchment); }

  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar input[type=search] { flex: 1; min-width: 120px; }

  input, select, textarea {
    background: var(--ink); color: var(--parchment); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 10px; font-family: inherit; font-size: 13.5px; width: 100%;
  }
  textarea { resize: vertical; }
  input[type=checkbox] { width: auto; accent-color: var(--brass); }

  .btn {
    border: 1px solid var(--brass-dim); background: transparent; color: var(--parchment);
    padding: 8px 14px; border-radius: var(--radius); font-size: 13px; cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  .btn.primary { background: var(--brass); border-color: var(--brass); color: var(--ink); font-weight: 600; }
  .btn.ghost { border-color: var(--border); color: var(--parchment-dim); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn.danger-text { color: var(--danger); border-color: var(--danger); margin-top: 8px; }
  .icon-btn { background: none; border: none; cursor: pointer; font-size: 15px; padding: 2px 4px; }
  .icon-btn.danger { filter: saturate(1.4); }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table th, table.data-table td { border-bottom: 1px solid var(--border); padding: 8px 6px; text-align: left; vertical-align: top; }
  table.data-table th { color: var(--brass); font-weight: 600; font-size: 12px; }
  table.data-table td.row-actions { white-space: nowrap; width: 1%; }
  .list-host { overflow-x: auto; }

  .empty, .muted { color: var(--parchment-dim); font-size: 13px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; padding: 20px; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; }
  @media (min-width: 640px) { .modal-overlay { align-items: center; } .modal-card { border-radius: var(--radius); } }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 12.5px; color: var(--parchment-dim); margin-bottom: 4px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

  .subtabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .subtab-btn { background: none; border: 1px solid var(--border); color: var(--parchment-dim); padding: 6px 14px; border-radius: var(--radius); cursor: pointer; font-family: inherit; font-size: 13px; }
  .subtab-btn.active { border-color: var(--brass); color: var(--brass); }

  .due-list { display: flex; flex-direction: column; gap: 6px; }
  .due-item { display: flex; justify-content: space-between; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--ink-2); font-size: 13px; }
  .due-date { font-family: 'IBM Plex Mono', monospace; color: var(--brass); font-size: 12px; }

  .plan-list { display: flex; flex-direction: column; gap: 10px; }
  .plan-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; background: var(--ink-2); }
  .plan-card-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .plan-no { font-family: 'IBM Plex Mono', monospace; color: var(--brass-dim); font-size: 12px; }
  .plan-details { font-size: 12.5px; color: var(--parchment-dim); margin-bottom: 8px; }
  .plan-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .meta-chip { font-size: 11.5px; border: 1px solid var(--border); border-radius: var(--radius); padding: 3px 8px; color: var(--parchment-dim); }
  .meta-chip .meta-label { color: var(--brass-dim); margin-right: 4px; }
  .plan-due { font-size: 13px; margin-bottom: 8px; }
  .plan-actions { display: flex; justify-content: flex-end; }
  .plan-history { margin-top: 8px; font-size: 12px; color: var(--parchment-dim); }
  .plan-history summary { cursor: pointer; color: var(--brass-dim); }
  .history-row { padding: 4px 0; border-top: 1px dashed var(--border); font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; }

  .lang-toggle { display: flex; gap: 6px; }
  .auth-panel { border-top: 1px dashed var(--border); margin-top: 16px; padding-top: 16px; }
  .error-text { color: var(--danger); font-size: 12.5px; }

  #tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--ink-2); border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; padding: 6px 2px;
    z-index: 20;
  }
  .tab-btn {
    background: none; border: none; color: var(--parchment-dim); font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; cursor: pointer; flex: 1;
  }
  .tab-btn.active { color: var(--brass); }
  .tab-icon { font-size: 17px; }
  .tab-label { font-size: 10px; }

  @media (min-width: 780px) {
    body { flex-direction: row; }
    #tabbar { position: static; flex-direction: column; width: 190px; height: 100vh; justify-content: flex-start; gap: 4px; padding: 16px 10px; border-top: none; border-right: 1px solid var(--border); }
    .tab-btn { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 10px 12px; border-radius: var(--radius); }
    .tab-btn.active { background: var(--ink); }
    .tab-label { font-size: 13px; }
    #app { padding: 24px; padding-bottom: 24px; max-width: 760px; }
    header.topbar { display: none; }
  }

  @media print { #tabbar, header.topbar, .toolbar, .form-actions, .plan-actions { display: none !important; } }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">ን</div>
      <h1 data-i18n="app_title">የንብረትና ሂሳብ ቁጥጥር ክፍል</h1>
    </div>
  </header>

  <nav id="tabbar"></nav>
  <main id="app"></main>

  <!-- CDN libraries, cached by the service worker after first online load -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script src="ethiopian-calendar.js"></script>
  <script src="i18n.js"></script>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="plan-seed.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
